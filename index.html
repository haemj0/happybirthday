<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Персонаж — Алёна</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Russo+One&family=Unbounded:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="icon" href="icon.png" type="image/x-icon">

  <style>
  /* =========================================================
     БАЗОВЫЕ НАСТРОЙКИ
  ========================================================= */

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  * {
    margin: 0;
    padding: 0;
  }

  :root {
    color-scheme: dark;

    --bg-1: #07060d;
    --bg-2: #110b1c;
    --bg-3: #241332;

    --panel: rgba(15, 11, 24, 0.94);
    --panel-light: rgba(45, 27, 55, 0.9);
    --panel-purple: rgba(68, 35, 79, 0.84);

    --gold: #e9bd66;
    --gold-bright: #ffe4a1;
    --gold-light: #fff2c7;
    --gold-dark: #895320;

    --purple: #a55ce0;
    --purple-light: #d39cff;
    --pink: #f36cbd;
    --green: #8ddb62;
    --blue: #65baff;
    --cyan: #5ad8ca;

    --text: #fff4d5;
    --text-soft: rgba(255, 244, 213, 0.82);
    --text-muted: rgba(255, 244, 213, 0.6);

    --border: rgba(238, 194, 105, 0.74);
    --border-soft: rgba(255, 229, 167, 0.18);

    --panel-radius: 22px 7px 22px 7px;

    --shadow-panel:
      0 18px 38px rgba(0, 0, 0, 0.38),
      0 2px 8px rgba(0, 0, 0, 0.42),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);

    --transition-fast: 160ms ease;
    --transition-normal: 260ms ease;
  }

  html {
    min-height: 100%;
    scroll-behavior: smooth;
    background: var(--bg-1);
  }

  body {
    min-height: 100vh;
    overflow-x: hidden;

    color: var(--text);
    font-family: "Jura", sans-serif;

    background-color: var(--bg-1);
    background-image:
      linear-gradient(
        90deg,
        rgba(4, 4, 10, 0.97) 0%,
        rgba(13, 8, 23, 0.88) 35%,
        rgba(24, 12, 34, 0.47) 66%,
        rgba(5, 5, 11, 0.22) 100%
      ),
      linear-gradient(
        180deg,
        rgba(8, 7, 15, 0.05),
        rgba(6, 5, 12, 0.18) 55%,
        rgba(4, 4, 9, 0.8) 100%
      ),
      url("fantasy-bg.jpg"),
      linear-gradient(135deg, #111426, #321d43 48%, #12101d);

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;

    background:
      radial-gradient(
        circle at 72% 34%,
        rgba(255, 213, 128, 0.2),
        transparent 23%
      ),
      radial-gradient(
        circle at 46% 76%,
        rgba(151, 74, 220, 0.16),
        transparent 31%
      ),
      linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.28),
        transparent 42%,
        rgba(0, 0, 0, 0.04)
      );
  }

  body::after {
    content: "";
    position: fixed;
    inset: -30px;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;

    background-image:
      radial-gradient(circle at 8% 18%, #fff0bd 0 1px, transparent 1.7px),
      radial-gradient(circle at 19% 53%, #b77af3 0 1px, transparent 1.7px),
      radial-gradient(circle at 37% 13%, #fff2c6 0 1px, transparent 1.7px),
      radial-gradient(circle at 56% 32%, #d49aff 0 1px, transparent 1.7px),
      radial-gradient(circle at 72% 19%, #fff1c0 0 1px, transparent 1.7px),
      radial-gradient(circle at 84% 11%, #b56cf0 0 1px, transparent 1.7px),
      radial-gradient(circle at 92% 61%, #f4c36d 0 1px, transparent 1.7px),
      radial-gradient(circle at 74% 82%, #fff0bd 0 1px, transparent 1.7px);

    transform: translate3d(0, 0, 0);
    animation: stars-drift 18s ease-in-out infinite alternate;
    will-change: transform;
  }

  @keyframes stars-drift {
    from {
      transform: translate3d(0, 0, 0);
    }

    to {
      transform: translate3d(12px, -16px, 0);
    }
  }

  a,
  button {
    -webkit-tap-highlight-color: transparent;
  }

  img,
  svg {
    display: block;
  }


  /* =========================================================
     ОСНОВНОЙ КОНТЕЙНЕР
  ========================================================= */

  .screen {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 100vh;
    padding: 18px 24px 24px;
    isolation: isolate;
  }


  /* =========================================================
     МАГИЧЕСКИЕ ЧАСТИЦЫ
  ========================================================= */

  .magic-orb {
    position: fixed;
    z-index: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;

    opacity: 0.72;
    transform: translate3d(0, 0, 0);
    animation: orb-float 8s ease-in-out infinite;
    will-change: transform, opacity;
  }

  .orb-1 {
    left: 9%;
    top: 82%;

    background: var(--gold-bright);
    box-shadow:
      0 0 8px var(--gold-bright),
      0 0 22px rgba(255, 217, 135, 0.62);

    animation-delay: -1s;
  }

  .orb-2 {
    left: 54%;
    top: 17%;

    background: var(--purple-light);
    box-shadow:
      0 0 8px var(--purple-light),
      0 0 22px rgba(179, 106, 241, 0.58);

    animation-delay: -3s;
  }

  .orb-3 {
    left: 86%;
    top: 70%;

    background: var(--cyan);
    box-shadow:
      0 0 8px var(--cyan),
      0 0 20px rgba(90, 216, 202, 0.52);

    animation-delay: -5s;
  }

  .orb-4 {
    left: 38%;
    top: 64%;

    width: 4px;
    height: 4px;

    background: #ffffff;
    box-shadow:
      0 0 8px #ffffff,
      0 0 18px rgba(255, 255, 255, 0.55);

    animation-delay: -7s;
  }

  @keyframes orb-float {
    0%,
    100% {
      opacity: 0.35;
      transform: translate3d(0, 0, 0) scale(0.85);
    }

    50% {
      opacity: 1;
      transform: translate3d(14px, -32px, 0) scale(1.18);
    }
  }


  /* =========================================================
     SVG-ИКОНКИ
  ========================================================= */

  .svg-sprite {
    display: none;
  }

  .game-icon {
    width: 31px;
    height: 31px;
    flex: 0 0 auto;

    color: currentColor;

    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.65));

    transition:
      transform var(--transition-fast),
      color var(--transition-fast);
  }


  /* =========================================================
     ВЕРХНЕЕ МЕНЮ
  ========================================================= */

  .top-menu {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }

  .menu-tab {
    --tab-rgb: 235, 190, 100;
    --cut: 11px;

    position: relative;
    isolation: isolate;
    min-width: 0;
    min-height: 72px;
    padding: 10px 12px;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    color: var(--text);
    text-decoration: none;
    text-align: center;

    font-family: "Russo One", sans-serif;
    font-size: clamp(10px, 0.8vw, 14px);
    line-height: 1.2;
    letter-spacing: 0.3px;

    border: 1px solid rgba(var(--tab-rgb), 0.72);

    clip-path: polygon(
      var(--cut) 0,
      100% 0,
      100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%,
      0 100%,
      0 var(--cut)
    );

    background:
      linear-gradient(
        180deg,
        rgba(var(--tab-rgb), 0.25) 0%,
        rgba(42, 26, 51, 0.92) 43%,
        rgba(12, 9, 20, 0.98) 100%
      );

    box-shadow:
      0 11px 24px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      inset 0 -20px 30px rgba(0, 0, 0, 0.18);

    text-shadow:
      0 2px 6px rgba(0, 0, 0, 0.85),
      0 0 10px rgba(var(--tab-rgb), 0.22);

    transform: translate3d(0, 0, 0);

    transition:
      transform var(--transition-fast),
      border-color var(--transition-fast),
      box-shadow var(--transition-fast),
      color var(--transition-fast);
  }

  .menu-tab::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 5px;
    pointer-events: none;

    clip-path: inherit;

    border: 1px solid rgba(255, 244, 211, 0.16);
  }

  .menu-tab::after {
    content: "";
    position: absolute;
    z-index: -1;
    top: -40%;
    bottom: -40%;
    left: -45%;
    width: 36%;
    pointer-events: none;

    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.22),
      transparent
    );

    transform: translate3d(-220%, 0, 0) rotate(15deg);
    transition: transform 520ms ease;
  }

  .menu-tab:hover,
  .menu-tab:focus-visible {
    color: #fff7db;
    transform: translate3d(0, -3px, 0);

    border-color: rgba(var(--tab-rgb), 1);

    box-shadow:
      0 15px 30px rgba(0, 0, 0, 0.42),
      0 0 18px rgba(var(--tab-rgb), 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.16);
  }

  .menu-tab:hover::after,
  .menu-tab:focus-visible::after {
    transform: translate3d(520%, 0, 0) rotate(15deg);
  }

  .menu-tab:hover .game-icon,
  .menu-tab:focus-visible .game-icon {
    transform: translate3d(0, -2px, 0) scale(1.08) rotate(-3deg);
  }

  .menu-tab.active {
    color: #fff9e9;
    transform: translate3d(0, -3px, 0);

    border-color: rgba(var(--tab-rgb), 1);

    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(var(--tab-rgb), 0.3),
        transparent 55%
      ),
      linear-gradient(
        180deg,
        rgba(var(--tab-rgb), 0.36) 0%,
        rgba(52, 31, 63, 0.97) 45%,
        rgba(13, 10, 22, 0.99) 100%
      );

    box-shadow:
      0 15px 32px rgba(0, 0, 0, 0.43),
      0 0 22px rgba(var(--tab-rgb), 0.27),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }

  .menu-tab.active::before {
    border-color: rgba(255, 247, 218, 0.28);
  }

  .menu-tab.active .game-icon {
    color: rgb(var(--tab-rgb));
  }

  .menu-tab:focus-visible {
    outline: 2px solid rgba(var(--tab-rgb), 0.95);
    outline-offset: 4px;
  }

  .tab-gold {
    --tab-rgb: 244, 200, 105;
  }

  .tab-brown {
    --tab-rgb: 201, 120, 76;
  }

  .tab-blue {
    --tab-rgb: 91, 152, 241;
  }

  .tab-purple {
    --tab-rgb: 177, 95, 234;
  }

  .tab-green {
    --tab-rgb: 73, 204, 180;
  }

  .tab-amber {
    --tab-rgb: 237, 155, 69;
  }

  .tab-navy {
    --tab-rgb: 91, 123, 220;
  }


  /* =========================================================
     ОСНОВНАЯ СЕТКА
  ========================================================= */

  .main-layout {
    display: grid;
    grid-template-columns: minmax(540px, 50%) minmax(0, 1fr);
    gap: 26px;
    min-height: calc(100vh - 116px);
  }

  .left-ui {
    width: 100%;
    max-width: 900px;

    display: flex;
    flex-direction: column;
    gap: 13px;
  }


  /* =========================================================
     ОБЩИЙ СТИЛЬ ИГРОВЫХ ПАНЕЛЕЙ
  ========================================================= */

  .game-panel {
    position: relative;
    isolation: isolate;
    overflow: hidden;

    border: 1px solid var(--border);
    border-radius: var(--panel-radius);

    background:
      linear-gradient(
        110deg,
        rgba(11, 9, 18, 0.97) 0%,
        rgba(38, 23, 47, 0.93) 62%,
        rgba(50, 27, 58, 0.88) 100%
      );

    box-shadow: var(--shadow-panel);

    transform: translate3d(0, 0, 0);

    transition:
      transform var(--transition-fast),
      border-color var(--transition-fast),
      box-shadow var(--transition-fast);
  }

  .game-panel::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 6px;
    pointer-events: none;

    border: 1px solid rgba(255, 240, 199, 0.16);
    border-radius: 16px 4px 16px 4px;
  }

  .game-panel::after {
    content: "";
    position: absolute;
    z-index: -2;
    inset: 0;
    pointer-events: none;

    background:
      linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.08),
        transparent 28%
      ),
      radial-gradient(
        circle at 0% 0%,
        rgba(255, 215, 130, 0.18),
        transparent 25%
      ),
      radial-gradient(
        circle at 100% 100%,
        rgba(166, 83, 218, 0.13),
        transparent 30%
      );
  }

  .profile-card:hover,
  .level-up-card:hover,
  .stats-bar:hover,
  .character-nameplate:hover,
  .corner-info:hover {
    transform: translate3d(0, -3px, 0);
    border-color: rgba(255, 225, 157, 0.96);

    box-shadow:
      0 22px 42px rgba(0, 0, 0, 0.43),
      0 0 22px rgba(235, 190, 100, 0.14),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }


  /* =========================================================
     КАРТОЧКИ ПЕРСОНАЖА
  ========================================================= */

  .profile-card {
    min-height: 116px;
    display: grid;
    grid-template-columns: 130px minmax(0, 1fr);
    align-items: center;
    padding: 17px 26px;
  }

  .big-card {
    min-height: 154px;

    background:
      radial-gradient(
        circle at 90% 40%,
        rgba(169, 89, 219, 0.18),
        transparent 34%
      ),
      linear-gradient(
        110deg,
        rgba(9, 8, 15, 0.98),
        rgba(40, 24, 48, 0.94) 60%,
        rgba(57, 29, 65, 0.9)
      );
  }

  .round-emblem {
    position: relative;
    z-index: 2;

    width: 88px;
    height: 88px;
    border-radius: 50%;

    display: grid;
    place-items: center;

    color: var(--gold-bright);

    border: 1px solid rgba(246, 209, 130, 0.84);

    background:
      radial-gradient(
        circle at 42% 34%,
        rgba(255, 226, 160, 0.24),
        rgba(18, 13, 24, 0.96) 63%
      );

    box-shadow:
      0 0 18px rgba(239, 189, 91, 0.2),
      inset 0 0 20px rgba(0, 0, 0, 0.7);

    transition:
      transform var(--transition-normal),
      border-color var(--transition-fast),
      box-shadow var(--transition-fast);
  }

  .round-emblem::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: inherit;

    border: 1px solid rgba(255, 239, 197, 0.18);
  }

  .round-emblem::after {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: inherit;
    pointer-events: none;

    border: 1px dashed rgba(237, 192, 103, 0.2);

    animation: emblem-rotate 18s linear infinite;
  }

  @keyframes emblem-rotate {
    to {
      transform: rotate(360deg);
    }
  }

  .profile-card:hover .round-emblem {
    transform: scale(1.05) rotate(-2deg);
    border-color: rgba(255, 231, 170, 1);

    box-shadow:
      0 0 25px rgba(239, 189, 91, 0.28),
      inset 0 0 20px rgba(0, 0, 0, 0.68);
  }

  .round-emblem svg {
    width: 49px;
    height: 49px;
    stroke-width: 1.65;

    filter: drop-shadow(0 0 5px rgba(255, 221, 146, 0.44));
  }

  .level-emblem {
    color: var(--gold-light);
    font-family: "Russo One", sans-serif;
    font-size: 32px;

    text-shadow:
      0 3px 8px rgba(0, 0, 0, 0.8),
      0 0 12px rgba(247, 202, 112, 0.22);
  }

  .small-label {
    position: relative;
    z-index: 2;
    margin-bottom: 7px;

    color: var(--text-soft);

    font-family: "Russo One", sans-serif;
    font-size: clamp(11px, 0.88vw, 16px);
    line-height: 1.35;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .profile-card h1,
  .profile-card h2 {
    position: relative;
    z-index: 2;
    overflow-wrap: anywhere;
  }

  .profile-card h1 {
    color: var(--cream);

    font-family: "Unbounded", sans-serif;
    font-size: clamp(43px, 4.25vw, 76px);
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: 4px;

    text-shadow:
      0 4px 12px rgba(0, 0, 0, 0.9),
      0 0 16px rgba(255, 221, 143, 0.32);
  }

  .profile-card h2 {
    color: var(--cream);

    font-family: "Unbounded", sans-serif;
    font-size: clamp(25px, 2.25vw, 42px);
    font-weight: 600;
    line-height: 1.08;

    text-shadow:
      0 3px 10px rgba(0, 0, 0, 0.88),
      0 0 13px rgba(255, 221, 143, 0.2);
  }


  /* =========================================================
     LEVEL UP
  ========================================================= */

  .level-up-card {
    min-height: 166px;
    display: grid;
    grid-template-columns: 176px 1px minmax(0, 1fr) 120px;
    align-items: center;
    padding: 21px 30px;

    border-color: rgba(248, 209, 124, 0.9);

    background:
      radial-gradient(
        circle at 84% 48%,
        rgba(255, 195, 75, 0.18),
        transparent 25%
      ),
      radial-gradient(
        circle at 46% 50%,
        rgba(150, 70, 211, 0.22),
        transparent 38%
      ),
      linear-gradient(
        100deg,
        rgba(16, 9, 24, 0.98),
        rgba(54, 27, 66, 0.94) 56%,
        rgba(38, 23, 46, 0.96)
      );
  }

  .level-up-card::after {
    background:
      linear-gradient(
        115deg,
        rgba(255, 255, 255, 0.08),
        transparent 30%
      ),
      radial-gradient(
        circle at 84% 50%,
        rgba(255, 218, 129, 0.22),
        transparent 24%
      ),
      conic-gradient(
        from 30deg at 84% 50%,
        transparent,
        rgba(255, 218, 129, 0.08),
        transparent 32%
      );

    animation: level-aura 4.8s ease-in-out infinite;
  }

  @keyframes level-aura {
    0%,
    100% {
      opacity: 0.72;
      transform: scale(1);
    }

    50% {
      opacity: 1;
      transform: scale(1.025);
    }
  }

  .level-left,
  .level-right,
  .level-divider,
  .magic-heart {
    position: relative;
    z-index: 2;
  }

  .level-left p {
    margin-bottom: 5px;

    color: var(--gold-bright);

    font-family: "Russo One", sans-serif;
    font-size: 19px;
    line-height: 1.2;
    letter-spacing: 0.9px;
  }

  .level-left strong {
    color: var(--cream);

    font-family: "Unbounded", sans-serif;
    font-size: clamp(62px, 5vw, 78px);
    font-weight: 800;
    line-height: 0.95;

    text-shadow:
      0 4px 11px rgba(0, 0, 0, 0.85),
      0 0 18px rgba(255, 217, 132, 0.35);
  }

  .level-divider {
    width: 1px;
    height: 100px;

    background: linear-gradient(
      to bottom,
      transparent,
      rgba(255, 229, 170, 0.9),
      transparent
    );

    box-shadow: 0 0 10px rgba(255, 213, 126, 0.28);
  }

  .level-right {
    min-width: 0;
    margin-left: 28px !important;
  }

  .level-right p {
    margin-bottom: 7px;

    color: var(--text-soft);

    font-family: "Russo One", sans-serif;
    font-size: 18px;
  }

  .level-right h2 {
    color: var(--gold-light);

    font-family: "Unbounded", sans-serif;
    font-size: clamp(24px, 2.15vw, 39px);
    font-weight: 600;
    line-height: 1.14;

    overflow-wrap: anywhere;

    text-shadow:
      0 3px 10px rgba(0, 0, 0, 0.8),
      0 0 14px rgba(255, 216, 127, 0.25);
  }

  .magic-heart {
    display: grid;
    place-items: center;

    color: var(--gold-bright);

    animation: heart-pulse 2.8s ease-in-out infinite;
    will-change: transform, opacity;
  }

  .magic-heart svg {
    width: 84px;
    height: 84px;
    stroke-width: 1.8;

    filter: drop-shadow(0 0 8px rgba(255, 217, 126, 0.42));
  }

  @keyframes heart-pulse {
    0%,
    100% {
      opacity: 0.78;
      transform: scale(0.96);
    }

    50% {
      opacity: 1;
      transform: scale(1.05);
    }
  }


  /* =========================================================
     ПОЛОСЫ ХАРАКТЕРИСТИК
  ========================================================= */

  .stats-bar {
    min-height: 82px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 17px;
    padding: 15px 21px;
  }

  .stat-item {
    position: relative;
    z-index: 2;
    min-width: 0;

    display: grid;
    grid-template-columns: 43px minmax(0, 1fr) auto;
    align-items: center;
    gap: 11px;
  }

  .stat-icon {
    width: 41px;
    height: 41px;
    border-radius: 50%;

    display: grid;
    place-items: center;

    border: 1px solid rgba(255, 255, 255, 0.34);

    box-shadow:
      inset 0 0 11px rgba(0, 0, 0, 0.5),
      0 4px 9px rgba(0, 0, 0, 0.28);

    transition: transform var(--transition-fast);
  }

  .stat-item:hover .stat-icon {
    transform: scale(1.08) rotate(-4deg);
  }

  .stat-icon svg {
    width: 24px;
    height: 24px;
    stroke-width: 2;
  }

  .stat-icon.pink {
    color: #ffe2f4;

    background:
      radial-gradient(circle at 35% 30%, #ff9ed8, #c84499 48%, #4f173d);

    box-shadow:
      0 0 15px rgba(243, 108, 189, 0.24),
      inset 0 0 11px rgba(0, 0, 0, 0.43);
  }

  .stat-icon.green {
    color: #f3ffe3;

    background:
      radial-gradient(circle at 35% 30%, #c6ff9e, #69bd4a 48%, #24451e);

    box-shadow:
      0 0 15px rgba(141, 219, 98, 0.22),
      inset 0 0 11px rgba(0, 0, 0, 0.43);
  }

  .stat-icon.blue {
    color: #e3f6ff;

    background:
      radial-gradient(circle at 35% 30%, #b5e5ff, #428fd5 48%, #1d335f);

    box-shadow:
      0 0 15px rgba(101, 186, 255, 0.22),
      inset 0 0 11px rgba(0, 0, 0, 0.43);
  }

  .stat-info {
    min-width: 0;
  }

  .stat-info span {
    display: block;
    margin-bottom: 6px;

    color: var(--text);

    font-family: "Russo One", sans-serif;
    font-size: 14px;
    line-height: 1;
  }

  .stat-item b {
    color: var(--text);

    font-family: "Russo One", sans-serif;
    font-size: 12px;
    white-space: nowrap;
  }

  .bar {
    position: relative;
    width: 100%;
    height: 10px;
    overflow: hidden;

    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 999px;

    background: rgba(0, 0, 0, 0.5);

    box-shadow:
      inset 0 2px 5px rgba(0, 0, 0, 0.75),
      0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .fill {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: inherit;
  }

  .fill::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -42%;
    width: 35%;

    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.72),
      transparent
    );

    transform: translate3d(-120%, 0, 0);
    animation: bar-shine 4.5s ease-in-out infinite;
    will-change: transform;
  }

  @keyframes bar-shine {
    0%,
    55% {
      transform: translate3d(-160%, 0, 0);
    }

    82%,
    100% {
      transform: translate3d(520%, 0, 0);
    }
  }

  .pink-fill {
    background: linear-gradient(90deg, #d83e9d, #ff83ca 62%, #ffd1eb);
  }

  .green-fill {
    background: linear-gradient(90deg, #64b743, #a8e96e 62%, #e2ffae);
  }

  .blue-fill {
    background: linear-gradient(90deg, #3c85d1, #76c7ff 62%, #c9edff);
  }


  /* =========================================================
     ОКНО ВКЛАДОК
  ========================================================= */

  .tab-window {
    min-height: 205px;
    margin-top: 2px;
    padding: 25px 30px;
  }

  .tab-content,
  .welcome-content {
    position: relative;
    z-index: 2;
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
    animation: tab-open 260ms ease-out both;
  }

  .welcome-content.hidden {
    display: none;
  }

  @keyframes tab-open {
    from {
      opacity: 0;
      transform: translate3d(0, 8px, 0);
    }

    to {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }
  }

  .tab-content h3,
  .welcome-content h3 {
    margin-bottom: 12px;

    color: var(--gold-light);

    font-family: "Russo One", sans-serif;
    font-size: clamp(22px, 1.95vw, 33px);
    line-height: 1.2;

    text-shadow:
      0 3px 8px rgba(0, 0, 0, 0.78),
      0 0 12px rgba(239, 191, 101, 0.2);
  }

  .tab-content p,
  .welcome-content p {
    margin-bottom: 12px;

    color: var(--text-soft);

    font-size: 17px;
    font-weight: 500;
    line-height: 1.62;
  }

  .tab-content ul {
    display: grid;
    gap: 7px;
    padding-left: 21px;
  }

  .tab-content li {
    color: var(--text-soft);

    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
  }

  .hint-line {
    margin-top: 16px;
    padding: 12px 14px;

    color: var(--text-soft);

    font-family: "Russo One", sans-serif;
    font-size: 13px;
    line-height: 1.45;
    letter-spacing: 0.3px;

    border: 1px solid rgba(240, 196, 104, 0.38);
    border-radius: 13px 4px 13px 4px;

    background:
      linear-gradient(
        90deg,
        rgba(239, 191, 101, 0.11),
        rgba(158, 72, 209, 0.08)
      );
  }


  /* =========================================================
     ЗОНА ПЕРСОНАЖА
  ========================================================= */

  .character-zone {
    position: relative;
    isolation: isolate;
    min-width: 0;
    min-height: 710px;
    overflow: hidden;

    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .character-glow {
    position: absolute;
    z-index: 0;
    top: 9%;
    right: 5%;

    width: min(39vw, 580px);
    aspect-ratio: 1;
    border-radius: 50%;

    pointer-events: none;

    background:
      radial-gradient(
        circle,
        rgba(255, 223, 151, 0.22) 0%,
        rgba(167, 88, 224, 0.14) 40%,
        transparent 70%
      );

    transform: translate3d(0, 0, 0);
    animation: glow-breathe 5.5s ease-in-out infinite;
    will-change: transform, opacity;
  }

  @keyframes glow-breathe {
    0%,
    100% {
      opacity: 0.66;
      transform: scale(0.97);
    }

    50% {
      opacity: 1;
      transform: scale(1.04);
    }
  }

  .rune-ring {
    position: absolute;
    z-index: 0;
    top: 16%;
    right: 13%;

    width: min(29vw, 430px);
    aspect-ratio: 1;
    border-radius: 50%;

    pointer-events: none;
    opacity: 0.58;

    border: 1px solid rgba(247, 212, 137, 0.28);

    background:
      radial-gradient(
        circle,
        transparent 0 51%,
        rgba(172, 92, 225, 0.06) 52% 54%,
        transparent 55%
      ),
      repeating-conic-gradient(
        from 0deg,
        rgba(247, 212, 137, 0.28) 0deg 1deg,
        transparent 1deg 17deg
      );

    box-shadow:
      0 0 28px rgba(239, 192, 100, 0.09),
      inset 0 0 30px rgba(164, 79, 219, 0.08);

    animation: rune-rotate 34s linear infinite;
    will-change: transform;
  }

  .rune-ring::before,
  .rune-ring::after {
    content: "";
    position: absolute;
    border-radius: inherit;
    pointer-events: none;
  }

  .rune-ring::before {
    inset: 10%;

    border: 1px dashed rgba(255, 237, 191, 0.28);

    animation: rune-rotate-reverse 25s linear infinite;
  }

  .rune-ring::after {
    inset: 22%;

    border: 1px solid rgba(181, 101, 232, 0.24);

    box-shadow:
      0 0 18px rgba(168, 84, 220, 0.08),
      inset 0 0 18px rgba(168, 84, 220, 0.08);
  }

  @keyframes rune-rotate {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes rune-rotate-reverse {
    to {
      transform: rotate(-360deg);
    }
  }

  .character-img {
    position: relative;
    z-index: 2;

    max-width: 100%;
    max-height: calc(100vh - 106px);

    object-fit: contain;
    object-position: center bottom;

    filter:
      drop-shadow(0 30px 24px rgba(0, 0, 0, 0.7))
      drop-shadow(0 0 12px rgba(255, 219, 143, 0.12));

    transform: translate3d(0, 0, 0);
    animation: character-idle 5.6s ease-in-out infinite;
    will-change: transform;
  }

  @keyframes character-idle {
    0%,
    100% {
      transform: translate3d(0, 0, 0);
    }

    50% {
      transform: translate3d(0, -7px, 0);
    }
  }

  .character-img.hidden {
    display: none;
  }

  .character-placeholder {
    position: relative;
    z-index: 2;

    width: min(410px, 86%);
    height: 610px;
    padding: 30px;

    display: none;
    place-items: center;

    color: var(--text-soft);

    text-align: center;
    font-family: "Russo One", sans-serif;
    font-size: 18px;
    line-height: 1.8;

    border: 1px solid rgba(245, 208, 127, 0.66);
    border-radius: 22px 7px 22px 7px;

    background:
      radial-gradient(
        circle at 50% 22%,
        rgba(255, 220, 145, 0.18),
        transparent 20%
      ),
      linear-gradient(
        180deg,
        rgba(46, 28, 54, 0.94),
        rgba(10, 8, 17, 0.98)
      );

    box-shadow:
      0 24px 46px rgba(0, 0, 0, 0.46),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }


  /* =========================================================
     ИНФОРМАЦИОННЫЕ ПЛАШКИ СПРАВА
  ========================================================= */

  .character-nameplate,
  .corner-info {
    position: absolute;
    z-index: 4;
    overflow: hidden;

    border: 1px solid rgba(240, 198, 111, 0.66);
    border-radius: 15px 4px 15px 4px;

    background:
      linear-gradient(
        110deg,
        rgba(9, 8, 15, 0.97),
        rgba(45, 27, 53, 0.94)
      );

    box-shadow:
      0 13px 27px rgba(0, 0, 0, 0.38),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);

    transition:
      transform var(--transition-fast),
      border-color var(--transition-fast),
      box-shadow var(--transition-fast);
  }

  .character-nameplate::before,
  .corner-info::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 45%;
    height: 2px;

    background: linear-gradient(
      90deg,
      var(--gold-bright),
      transparent
    );

    box-shadow: 0 0 10px rgba(246, 207, 124, 0.35);
  }

  .character-nameplate {
    right: 35px;
    bottom: 30px;
    min-width: 285px;
    padding: 14px 18px;
  }

  .character-nameplate span {
    display: block;
    margin-bottom: 6px;

    color: var(--text-muted);

    font-family: "Russo One", sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
  }

  .character-nameplate b {
    color: var(--cream);

    font-family: "Unbounded", sans-serif;
    font-size: 19px;
    line-height: 1.25;

    text-shadow: 0 2px 7px rgba(0, 0, 0, 0.8);
  }

  .corner-info {
    top: 19px;
    right: 34px;
    padding: 12px 16px;

    color: var(--text-soft);

    font-family: "Russo One", sans-serif;
    font-size: 11px;
    line-height: 1.65;
  }


  /* =========================================================
     АДАПТИВ — НОУТБУКИ
  ========================================================= */

  @media (max-width: 1450px) {
    .screen {
      padding-inline: 20px;
    }

    .main-layout {
      grid-template-columns: minmax(510px, 54%) minmax(0, 46%);
      gap: 20px;
    }

    .top-menu {
      gap: 8px;
    }

    .menu-tab {
      padding-inline: 9px;
      gap: 7px;
    }

    .game-icon {
      width: 28px;
      height: 28px;
    }

    .level-up-card {
      grid-template-columns: 154px 1px minmax(0, 1fr) 98px;
    }

    .magic-heart svg {
      width: 70px;
      height: 70px;
    }
  }


  /* =========================================================
     АДАПТИВ — ПЛАНШЕТЫ
  ========================================================= */

  @media (max-width: 1180px) {
    .top-menu {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .main-layout {
      grid-template-columns: minmax(460px, 58%) minmax(0, 42%);
    }

    .profile-card {
      grid-template-columns: 108px minmax(0, 1fr);
      padding-inline: 20px;
    }

    .round-emblem {
      width: 76px;
      height: 76px;
    }

    .round-emblem svg {
      width: 42px;
      height: 42px;
    }

    .stats-bar {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .stat-item {
      grid-template-columns: 42px minmax(0, 1fr) 56px;
    }

    .character-zone {
      min-height: 640px;
    }
  }

  @media (max-width: 940px) {
    .main-layout {
      grid-template-columns: 1fr;
      min-height: auto;
    }

    .left-ui {
      max-width: none;
    }

    .character-zone {
      min-height: 570px;
      order: -1;
    }

    .character-img {
      max-height: 570px;
    }

    .character-glow {
      top: 5%;
      right: 50%;
      width: 520px;

      transform: translateX(50%);
    }

    .rune-ring {
      top: 12%;
      right: 50%;
      width: 370px;

      margin-right: -185px;
    }

    .corner-info {
      right: 20px;
    }
  }


  /* =========================================================
     АДАПТИВ — ТЕЛЕФОНЫ
  ========================================================= */

  @media (max-width: 680px) {
    body::after {
      animation: none;
    }

    .screen {
      padding: 12px;
    }

    .top-menu {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .menu-tab {
      min-height: 61px;
      padding: 8px;
      font-size: 10px;
    }

    .game-icon {
      width: 24px;
      height: 24px;
    }

    .main-layout {
      gap: 14px;
    }

    .left-ui {
      gap: 10px;
    }

    .profile-card {
      min-height: 96px;
      grid-template-columns: 77px minmax(0, 1fr);
      padding: 12px;
    }

    .big-card {
      min-height: 114px;
    }

    .round-emblem {
      width: 61px;
      height: 61px;
    }

    .round-emblem::after {
      animation: none;
    }

    .round-emblem svg {
      width: 34px;
      height: 34px;
    }

    .level-emblem {
      font-size: 23px;
    }

    .small-label {
      margin-bottom: 4px;
      font-size: 10px;
    }

    .profile-card h1 {
      font-size: clamp(34px, 12vw, 46px);
      letter-spacing: 1px;
    }

    .profile-card h2 {
      font-size: clamp(20px, 6vw, 27px);
    }

    .level-up-card {
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 18px;
      text-align: center;
    }

    .level-left strong {
      font-size: 60px;
    }

    .level-divider {
      width: 100%;
      height: 1px;
    }

    .level-right {
      margin-left: 0 !important;
    }

    .magic-heart svg {
      width: 61px;
      height: 61px;
    }

    .stats-bar {
      padding: 14px;
    }

    .tab-window {
      padding: 20px 18px;
    }

    .tab-content p,
    .welcome-content p {
      font-size: 15px;
    }

    .character-zone {
      min-height: 435px;
    }

    .character-img {
      max-height: 435px;
      animation-duration: 7s;
    }

    .character-placeholder {
      width: 280px;
      height: 390px;
      font-size: 14px;
    }

    .character-glow {
      width: 390px;
    }

    .rune-ring {
      top: 10%;
      width: 280px;
      margin-right: -140px;
      animation-duration: 48s;
    }

    .rune-ring::before {
      animation: none;
    }

    .character-nameplate {
      right: 8px;
      bottom: 8px;
      left: 8px;
      min-width: 0;
    }

    .corner-info {
      display: none;
    }
  }

  @media (max-width: 420px) {
    .top-menu {
      grid-template-columns: 1fr;
    }

    .menu-tab {
      justify-content: flex-start;
      min-height: 55px;
      padding-inline: 16px;
      font-size: 11px;
    }

    .profile-card h1 {
      font-size: 32px;
    }

    .profile-card h2 {
      font-size: 19px;
    }

    .stat-item {
      grid-template-columns: 38px minmax(0, 1fr) auto;
      gap: 8px;
    }

    .stat-icon {
      width: 36px;
      height: 36px;
    }

    .stat-icon svg {
      width: 21px;
      height: 21px;
    }
  }


  /* =========================================================
     УСТРОЙСТВА БЕЗ HOVER
  ========================================================= */

  @media (hover: none) {
    .menu-tab:hover,
    .profile-card:hover,
    .level-up-card:hover,
    .stats-bar:hover,
    .character-nameplate:hover,
    .corner-info:hover {
      transform: none;
    }

    .menu-tab:hover::after {
      transform: translate3d(-220%, 0, 0) rotate(15deg);
    }
  }


  /* =========================================================
     ОТКЛЮЧЕНИЕ АНИМАЦИЙ ПО НАСТРОЙКАМ ОС
  ========================================================= */

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

  <script>
    const menuButtons = document.querySelectorAll(".menu-tab");
    const tabContents = document.querySelectorAll(".tab-content");
    const welcomeContent = document.getElementById("welcomeContent");

    menuButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const selectedTab = button.dataset.tab;

        menuButtons.forEach((btn) => {
          btn.classList.remove("active");
        });

        tabContents.forEach((tab) => {
          tab.classList.remove("active");
        });

        welcomeContent.classList.add("hidden");
        button.classList.add("active");
        document.getElementById(selectedTab).classList.add("active");
      });
    });

    const characterImage = document.getElementById("characterImage");
    const characterPlaceholder = document.getElementById("characterPlaceholder");

    characterImage.addEventListener("error", () => {
      characterImage.classList.add("hidden");
      characterPlaceholder.style.display = "grid";
    });
  </script>
